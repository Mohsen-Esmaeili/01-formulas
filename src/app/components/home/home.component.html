<form [formGroup]="form">
  <h1>
    Welcome to the formulizer!
  </h1>
  <hr>
  <h3>Input formula</h3>
  <p>
    <mat-form-field class="w-100" appearance="fill">
      <mat-label>Formula</mat-label>
      <textarea matInput placeholder="Enter formula" formControlName="formula"></textarea>
    </mat-form-field>
  </p>
  <p><button class="btn btn-primary" (click)="updateAstView()">Parse and update AST View</button></p>
  <h3>Visualizer</h3>
  <pre style="max-height: 300px; overflow-y: auto;background-color: #eeeeee;">{{syntaxTreeJson}}</pre>
  <p><button class="btn btn-primary" (click)="convertAstToFormula()">Convert AST to Formula</button></p>
  <h3>Visualizer-to-Formula</h3>
  <p>{{ visualizerOutput }}</p>
</form>
