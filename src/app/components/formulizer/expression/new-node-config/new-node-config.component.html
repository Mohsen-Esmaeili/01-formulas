<h2 mat-dialog-title class="px-2">New expression configuration</h2>
<mat-divider *ngIf="!this.data?.positionId"></mat-divider>
<mat-dialog-content class="mat-typography">
  <mat-selection-list [multiple]="false" [formControl]="isInLeftSide" *ngIf="!this.data?.positionId">
    <ng-container *ngIf="isPower; else IsNotPower">
      <mat-list-option [value]="true">
        Expression
      </mat-list-option>
      <mat-list-option [value]="false">
        Power
      </mat-list-option>
    </ng-container>
    <ng-template #IsNotPower>
      <mat-list-option [value]="true">
        Left
      </mat-list-option>
      <mat-list-option [value]="false">
        Right
      </mat-list-option>
    </ng-template>
  </mat-selection-list>

  <ng-container *ngIf="requiredNumber;else TextInput">
    <mat-divider class="my-2"></mat-divider>
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>{{ valueTitle }}</mat-label>
      <input matInput placeholder="Enter the value" [formControl]="numberValue" autocomplete="off">
      <mat-error *ngIf="numberValue.invalid">
        {{ valueTitle }} is required. Please enter a valid number!
      </mat-error>
    </mat-form-field>
  </ng-container>

  <ng-template #TextInput>
    <mat-divider class="my-2"></mat-divider>
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Variable name</mat-label>
      <input matInput placeholder="Enter variable name" [formControl]="textValue" autocomplete="off">
      <mat-hint>Enter a character (a or b ...)</mat-hint>
      <mat-error *ngIf="textValue.invalid">
        Variable name is required. Please enter a valid variable name!
      </mat-error>
    </mat-form-field>
  </ng-template>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" cdkFocusInitial (click)="onSelect()"
    [disabled]="formIsInValid">Select</button>
</mat-dialog-actions>
