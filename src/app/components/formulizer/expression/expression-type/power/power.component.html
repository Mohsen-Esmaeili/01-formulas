<div class="d-flex flex-row flex-wrap align-items-center">
  <div class="m-1">
    <ng-container *ngIf="isParen(expression);else LeftIsPower">
      <app-expression [node]="expression" (removeEmitter)="onRemove($event)">
      </app-expression>
    </ng-container>
    <ng-template #LeftIsPower>
      <app-expression-item [node]="expression"></app-expression-item>
    </ng-template>
  </div>
  <div class="m-1 d-flex flex-column justify-content-center">
    <mat-form-field appearance="fill" class="select-control">
      <mat-select [(ngModel)]="operator">
        <mat-option value="ADDITION">+</mat-option>
        <mat-option value="SUBTRACTION">-</mat-option>
        <mat-option value="MULTIPLICATION">*</mat-option>
        <mat-option value="DIVISION">/</mat-option>
        <mat-option value="POWER">^</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="m-1">
    <ng-container *ngIf="isParen(power);else RightIsPower">
      <app-expression [node]="power" (removeEmitter)="onRemove($event)">
      </app-expression>
    </ng-container>
    <ng-template #RightIsPower>
      <app-expression-item [node]="power"></app-expression-item>
    </ng-template>
  </div>
</div>
