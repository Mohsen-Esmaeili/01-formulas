<div class="d-flex flex-row flex-wrap align-items-center">
  <div class="m-1">
    <app-expression [parentNode]="node" [node]="left"></app-expression>
  </div>
  <div class="mx-2 d-flex align-items-center operator-container" matTooltip="{{ node.result.toFixed(0) }}">
    <app-expression-list (newExpressionEmitter)="onUpdate($event)" [menuTriggerTmp]="ENode" [visible]="isSelected"
      [nodeType]="node.type">
    </app-expression-list>
    <ng-template #ENode>
      <button mat-mini-fab color="accent">
        <span class="operator">-</span>
      </button>
    </ng-template>
  </div>
  <div class="m-1">
    <app-expression [parentNode]="node" [node]="right"></app-expression>
  </div>
</div>
