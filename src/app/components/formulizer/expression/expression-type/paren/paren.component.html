<mat-card (click)="selectable ? onSelect($event) : false" [class.selected-expression]="isSelected"
  matBadge="{{ node.getValue().toFixed(0) }}" matBadgePosition="before" matBadgeColor="accent"
  [matBadgeHidden]="badgeIsHidden" class="d-flex flex-column justify-content-end">
  <div class="d-flex flex-row justify-content-end action-buttons">
    <app-expression-list (newExpressionEmitter)="onAddNew($event)" [visible]="isSelected"></app-expression-list>
    <button mat-mini-fab color="warn" *ngIf="isSelected" (click)="onRemoveNode()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <app-expression [parentNode]="node" [node]="parenExpression"></app-expression>
</mat-card>
