<form [formGroup]="form" class="formulizer-content">
  <div class="alert alert-success d-flex flex-row align-items-center">
    <button mat-mini-fab color="primary" class="mx-1" (click)="onGoHome()">
      <mat-icon>home</mat-icon>
    </button>
    <h1 class="mb-0 ml-2">Welcome to the formulizer!</h1>
  </div>
  <mat-divider></mat-divider>
  <div class="d-flex flex-column">
    <div class="m-2">
      <mat-form-field class="w-100" appearance="fill">
        <mat-label>Formula</mat-label>
        <textarea matInput placeholder="Enter formula" class="formula-text-area" formControlName="formula"></textarea>
      </mat-form-field>
    </div>
    <mat-tab-group>
      <mat-tab label="AST View">
        <div class="m-2">
          <button mat-raised-button color="primary" (click)="updateAstView()">Parse and update AST View</button>
        </div>
        <div class="m-2">
          <pre class="tree-content p-3" *ngIf="syntaxTreeJson">{{ syntaxTreeJson }}</pre>
        </div>
      </mat-tab>
      <mat-tab label="Formula View">
        <div class="m-2">
          <button mat-raised-button color="primary" (click)="convertAstToFormula()">Convert AST to Formula</button>
        </div>
        <div class="m-2">
          <pre class="formula-content p-3" *ngIf="visualizerOutput">{{ visualizerOutput }}</pre>
        </div>
      </mat-tab>
      <mat-tab label="Visualize Formula">
        <div class="m-2">
          <button mat-raised-button color="primary">Visualize Formula</button>
        </div>
        <div class="m-2">
          <div>
            <mat-card-title>Formula visualization</mat-card-title>
            <mat-card-subtitle>By clicking you can add your formula</mat-card-subtitle>
          </div>
          <pre class="visualize-content p-3" *ngIf="node">
            <app-expression [node]="node" [selectable]=false></app-expression>
          </pre>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</form>
