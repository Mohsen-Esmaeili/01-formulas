<div class="formulizer-content">
  <div class="alert alert-success d-flex flex-row align-items-center">
    <button mat-mini-fab color="primary" class="mx-1" (click)="onGoHome()">
      <mat-icon>home</mat-icon>
    </button>
    <h1 class="mb-0 ml-2">Formula</h1>
  </div>
  <mat-divider></mat-divider>
  <div class="d-flex flex-column">
    <div class="m-2">
      <mat-form-field class="w-100" appearance="fill">
        <mat-label>Formula</mat-label>
        <textarea matInput placeholder="Enter formula" class="formula-text-area" [formControl]="formula"
          (blur)="onBlur()"></textarea>
      </mat-form-field>
    </div>
    <mat-tab-group>
      <mat-tab label="AST View">
        <pre class="tree-content mt-2 p-3" *ngIf="syntaxTreeJson">{{ syntaxTreeJson }}</pre>
      </mat-tab>
      <mat-tab label="Formula View">
        <pre class="formula-content mt-2 p-4" *ngIf="visualizerOutput">{{ visualizerOutput }}</pre>
      </mat-tab>
      <mat-tab label="Visualize Formula">
        <div class="mt-2">
          <section class="d-flex flex-row justify-content-between">
            <div>
              <h1>Formula visualization</h1>
              <h5>By clicking you can add your formula</h5>
            </div>
            <div class="alert alert-primary" *ngIf="node">
              <h2>Final Result: {{ node.result.toFixed(2) }}</h2>
            </div>
          </section>
          <mat-card class="expression-container p-3" *ngIf="node">
            <app-expression [node]="node"></app-expression>
          </mat-card>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
