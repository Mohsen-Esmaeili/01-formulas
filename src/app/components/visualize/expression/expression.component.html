<mat-card class="expression">
  <div class="d-flex flex-row justify-content-end">
    <button mat-mini-fab color="warn" class="mx-1" (click)="RemoveNode(syntaxTree.id)" *ngIf="canRemove">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="d-flex flex-row flex-wrap align-items-center">
    <div class="m-1" *ngIf="leftExpression">
      <app-expression *ngIf="isNewExpression(leftExpression); else SingleInputLeft"
        [syntaxTree]="leftExpression.expression" [canRemove]="true" (removeEmitter)="RemoveNode($event)">
      </app-expression>
      <ng-template #SingleInputLeft>
        <app-expression-item [syntaxTree]="leftExpression" (valueEmitter)="onLeftValue($event)">
        </app-expression-item>
      </ng-template>
    </div>
    <div class="m-1 d-flex flex-column justify-content-center">
      <mat-form-field appearance="fill" class="select-control">
        <mat-select [(ngModel)]="operatorType">
          <mat-option value="ADDITION">Addition (+)</mat-option>
          <mat-option value="SUBTRACTION">Subtraction (-)</mat-option>
          <mat-option value="MULTIPLICATION">Multiplication (*)</mat-option>
          <mat-option value="DIVISION">Division (/)</mat-option>
          <mat-option value="POWER">Power (^)</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="m-1" *ngIf="rightExpression">
      <app-expression *ngIf="isNewExpression(rightExpression); else SingleInputRight"
        [syntaxTree]="rightExpression.expression" [canRemove]="true" (removeEmitter)="RemoveNode($event)">
      </app-expression>
      <ng-template #SingleInputRight>
        <app-expression-item [syntaxTree]="rightExpression" (valueEmitter)="onRightValue($event)">
        </app-expression-item>
      </ng-template>
    </div>
  </div>
</mat-card>
