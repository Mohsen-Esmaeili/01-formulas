<container-element [ngSwitch]="syntaxTree?.type" class="expression-item">
  <div *ngSwitchCase="'NUMBER'">
    <div class="alert alert-info const-value">{{ syntaxTree?.value }}</div>
  </div>
  <div *ngSwitchCase="'PI'">
    <div class="alert alert-info const-value">PI</div>
  </div>
  <div *ngSwitchCase="'E'">
    <div class="alert alert-info const-value">E</div>
  </div>
  <div *ngSwitchCase="'FUNCTION'">
    <div class="alert alert-success"><span class="const-value">{{ syntaxTree?.name }}</span>
      <ng-container *ngIf="syntaxTree?.arguments && syntaxTree.arguments.length > 0">
        <app-expression *ngFor="let arg of syntaxTree.arguments" [syntaxTree]="arg" [canRemove]="false" [canAdd]="false"
          (removeEmitter)="RemoveNode($event)">
        </app-expression>
      </ng-container>
    </div>
  </div>
  <div *ngSwitchCase="'VARIABLE'">
    <mat-form-field appearance="fill" class="input-control">
      <input matInput autocomplete="off" type="number" (blur)="onBlurInput($event)">
    </mat-form-field>
  </div>
  <div *ngSwitchDefault>Wrong</div>
</container-element>
